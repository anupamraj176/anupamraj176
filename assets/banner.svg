<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Sky Sunset Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0b25" />
      <stop offset="35%" stop-color="#23133a" />
      <stop offset="65%" stop-color="#541541" />
      <stop offset="85%" stop-color="#842646" />
      <stop offset="100%" stop-color="#ba4843" />
    </linearGradient>

    <!-- Sun Radial Glow -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="1" />
      <stop offset="40%" stop-color="#fb8500" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff006e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8338ec" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Petal Shape Template -->
    <g id="single-petal">
      <path d="M 0 0 C -3 -6 -8 -10 -4 -13 C 0 -16 6 -11 8 -7 C 10 -3 5 0 0 0 Z" fill="#ff8fa3" />
      <!-- Subtle petal highlight -->
      <path d="M 0 0 C -1 -4 -4 -6 -2 -8 C 0 -10 3 -7 4 -5 C 5 -3 2 0 0 0 Z" fill="#ffb3c6" opacity="0.6" />
    </g>
  </defs>

  <style>
    /* CSS Styling with Web-Safe System Fonts (No External Imports to prevent GitHub blocking) */
    .banner-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .title {
      font-size: 38px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 2px;
      filter: url(#neon-glow);
    }

    .subtitle {
      font-size: 15px;
      font-weight: 600;
      fill: #ff8fa3;
      letter-spacing: 4px;
      filter: url(#neon-glow);
    }

    .tagline {
      font-size: 11px;
      font-weight: 400;
      fill: #e2cce0;
      letter-spacing: 1px;
      opacity: 0.85;
    }

    /* Falling Petals Animations */
    .petal {
      transform-origin: center;
      opacity: 0;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
    }

    .p1 { animation: fall-drift-1 9s infinite linear; }
    .p2 { animation: fall-drift-2 12s infinite linear; }
    .p3 { animation: fall-drift-3 10s infinite linear; }
    .p4 { animation: fall-drift-4 14s infinite linear; }
    .p5 { animation: fall-drift-5 11s infinite linear; }
    .p6 { animation: fall-drift-6 8s infinite linear; }

    @keyframes fall-drift-1 {
      0% { transform: translate(120px, -20px) rotate(0deg) scale(0.7); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translate(320px, 320px) rotate(360deg) scale(0.7); opacity: 0; }
    }

    @keyframes fall-drift-2 {
      0% { transform: translate(250px, -20px) rotate(45deg) scale(0.9); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(500px, 320px) rotate(540deg) scale(0.9); opacity: 0; }
    }

    @keyframes fall-drift-3 {
      0% { transform: translate(400px, -20px) rotate(90deg) scale(0.6); opacity: 0; }
      8% { opacity: 0.8; }
      92% { opacity: 0.8; }
      100% { transform: translate(620px, 320px) rotate(270deg) scale(0.6); opacity: 0; }
    }

    @keyframes fall-drift-4 {
      0% { transform: translate(80px, 80px) rotate(20deg) scale(0.8); opacity: 0; }
      20% { opacity: 0.95; }
      80% { opacity: 0.95; }
      100% { transform: translate(280px, 320px) rotate(420deg) scale(0.8); opacity: 0; }
    }

    @keyframes fall-drift-5 {
      0% { transform: translate(550px, -20px) rotate(120deg) scale(0.7); opacity: 0; }
      12% { opacity: 0.9; }
      88% { opacity: 0.9; }
      100% { transform: translate(720px, 320px) rotate(480deg) scale(0.7); opacity: 0; }
    }

    @keyframes fall-drift-6 {
      0% { transform: translate(320px, -20px) rotate(10deg) scale(0.5); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translate(480px, 320px) rotate(180deg) scale(0.5); opacity: 0; }
    }

    /* Twinkling Stars */
    .star {
      fill: #ffffff;
      animation: twinkle 4s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background Sky -->
  <rect width="100%" height="100%" fill="url(#sky-grad)" />

  <!-- Stars -->
  <circle cx="95" cy="45" r="1" class="star" style="animation-delay: 0.5s;" />
  <circle cx="230" cy="85" r="1.2" class="star" style="animation-delay: 1.2s;" />
  <circle cx="340" cy="30" r="1" class="star" style="animation-delay: 2.1s;" />
  <circle cx="480" cy="90" r="1.5" class="star" style="animation-delay: 0.8s;" />
  <circle cx="720" cy="55" r="1" class="star" style="animation-delay: 1.8s;" />
  <circle cx="560" cy="35" r="1.2" class="star" style="animation-delay: 2.7s;" />

  <!-- Sun/Moon Glow & Core -->
  <circle cx="610" cy="150" r="120" fill="url(#sun-glow)" filter="url(#soft-glow)" opacity="0.65" />
  <circle cx="610" cy="150" r="75" fill="#ffd166" />
  <!-- Sun slices (retro style) -->
  <rect x="520" y="110" width="180" height="3" fill="#23133a" opacity="0.3" />
  <rect x="520" y="130" width="180" height="4" fill="#541541" opacity="0.5" />
  <rect x="520" y="150" width="180" height="6" fill="#842646" opacity="0.7" />
  <rect x="520" y="170" width="180" height="8" fill="#ba4843" />
  <rect x="520" y="192" width="180" height="12" fill="#ba4843" />

  <!-- Distant Mountains / Hills Silhouette -->
  <path d="M 0 270 Q 180 230 380 265 T 720 250 Q 760 260 800 270 L 800 300 L 0 300 Z" fill="#140b20" />
  <path d="M 0 282 Q 260 265 520 282 T 800 278 L 800 300 L 0 300 Z" fill="#09050f" />

  <!-- Pagoda Silhouette (on the right) -->
  <g fill="#09050f">
    <!-- Base structure -->
    <rect x="590" y="250" width="40" height="35" />
    
    <!-- Tier 1 Roof -->
    <path d="M 570 250 Q 610 240 650 250 L 642 258 L 578 258 Z" />
    <rect x="594" y="215" width="32" height="35" />
    
    <!-- Tier 2 Roof -->
    <path d="M 578 215 Q 610 206 642 215 L 636 222 L 584 222 Z" />
    <rect x="598" y="182" width="24" height="33" />
    
    <!-- Tier 3 Roof -->
    <path d="M 584 182 Q 610 174 636 182 L 631 188 L 589 188 Z" />
    <rect x="602" y="155" width="16" height="27" />
    
    <!-- Tier 4 Roof -->
    <path d="M 592 155 Q 610 148 628 155 L 624 160 L 596 160 Z" />
    
    <!-- Spire / Finial (Sorin) -->
    <line x1="610" y1="148" x2="610" y2="105" stroke="#09050f" stroke-width="2.5" />
    <circle cx="610" cy="120" r="3" />
    <circle cx="610" cy="112" r="2.5" />
    <circle cx="610" cy="105" r="1.5" />
  </g>

  <!-- Japanese Torii Gate Silhouette (middle right, near Pagoda) -->
  <g fill="#09050f" transform="translate(470, 238) scale(0.8)">
    <!-- Vertical Posts -->
    <path d="M 12 12 L 15 80 L 9 80 Z" />
    <path d="M 48 12 L 51 80 L 45 80 Z" />
    <!-- Top Beam (Kasagi) -->
    <path d="M 2 4 Q 30 -2 58 4 L 58 10 Q 30 5 2 10 Z" />
    <!-- Secondary Beam (Nuki) -->
    <rect x="7" y="20" width="46" height="5" />
    <!-- Center Support (Gakuzuka) -->
    <rect x="28" y="10" width="4" height="10" />
  </g>

  <!-- Cherry Blossom (Sakura) Hanging Branch (Left side framing) -->
  <g stroke="#09050f" fill="none" stroke-linecap="round">
    <!-- Main branch -->
    <path d="M 0 10 Q 90 20 120 70 T 80 180" stroke-width="6" />
    <!-- Sub-branches -->
    <path d="M 50 16 Q 100 45 85 90" stroke-width="3" />
    <path d="M 90 40 Q 140 60 115 105" stroke-width="2.5" />
    <path d="M 105 100 Q 135 130 110 155" stroke-width="2" />
    <path d="M 30 13 Q 50 60 20 95" stroke-width="2.5" />

    <!-- Blossoms (Groups of small colored circles) -->
    <g stroke="none" fill="#ff8fa3" opacity="0.95">
      <!-- Cluster 1 (Top left) -->
      <circle cx="35" cy="20" r="5" />
      <circle cx="43" cy="18" r="4.5" fill="#ffb3c6" />
      <circle cx="30" cy="26" r="4" />
      
      <!-- Cluster 2 (Mid-branch) -->
      <circle cx="85" cy="45" r="5.5" />
      <circle cx="95" cy="42" r="4.5" fill="#ffb3c6" />
      <circle cx="78" cy="50" r="5" />
      <circle cx="90" cy="52" r="4" fill="#ffccd5" />

      <!-- Cluster 3 (Sub-branch) -->
      <circle cx="115" cy="72" r="6" />
      <circle cx="125" cy="75" r="4.5" fill="#ffb3c6" />
      <circle cx="110" cy="80" r="5" />
      
      <!-- Cluster 4 (Outer branch tips) -->
      <circle cx="120" cy="110" r="5" />
      <circle cx="128" cy="108" r="4" fill="#ffb3c6" />
      <circle cx="110" cy="115" r="5" />

      <!-- Cluster 5 (Lower branch) -->
      <circle cx="92" cy="140" r="5.5" />
      <circle cx="102" cy="144" r="4.5" fill="#ffb3c6" />
      <circle cx="82" cy="148" r="5" />
      <circle cx="78" cy="165" r="5" fill="#ffccd5" />
    </g>
  </g>

  <!-- Left Side Text Content (Dracula / Cherry Blossom Palette) -->
  <g class="banner-text" transform="translate(60, 60)">
    <!-- Title -->
    <text x="0" y="55" class="title">Anupam Raj</text>
    
    <!-- Subtitle -->
    <text x="0" y="88" class="subtitle">&lt; FULL-STACK DEVELOPER /&gt;</text>
    
    <!-- Tagline -->
    <text x="0" y="112" class="tagline">Exploring Rust &amp; WebAssembly | Building MERN Web Apps</text>
  </g>

  <!-- Animated Falling Petals (using the template) -->
  <use href="#single-petal" class="petal p1" />
  <use href="#single-petal" class="petal p2" />
  <use href="#single-petal" class="petal p3" />
  <use href="#single-petal" class="petal p4" />
  <use href="#single-petal" class="petal p5" />
  <use href="#single-petal" class="petal p6" />
</svg>
